<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="row mt-3">
        <form>
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label"
              >Email address</label
            >
            <input
              type="email"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
            />
            <div id="emailHelp" class="form-text">
              We'll never share your email with anyone else.
            </div>
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label"
              >Password</label
            >
            <input
              type="password"
              class="form-control"
              id="exampleInputPassword1"
            />
          </div>
          <div class="mb-3 form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="exampleCheck1"
            />
            <label class="form-check-label" for="exampleCheck1"
              >Check me out</label
            >
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>

    <div class="container mt-5">
      <div class="row">
        <div class="col-12">
          <h5 class="mb-3">Login member</h5>

          <!-- Dùng Flexbox để căn ngang tất cả thành phần -->
          <form class="d-flex flex-wrap align-items-center gap-2" role="form">
            <!-- Field Email -->
            <div class="d-flex align-items-center gap-2">
              <label for="email" class="fw-bold text-nowrap"
                >Email address</label
              >
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Please input your email"
              />
            </div>

            <!-- Field Password -->
            <div class="d-flex align-items-center gap-2">
              <label for="password" class="fw-bold text-nowrap">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Please input your pass"
              />
            </div>

            <!-- Remember me -->
            <div class="form-check m-0 d-flex align-items-center gap-1">
              <input
                class="form-check-input"
                type="checkbox"
                name="remember"
                id="remember"
              />
              <label class="form-check-label text-nowrap" for="remember">
                Remember me
              </label>
            </div>

            <!-- Submit Button -->
            <button class="btn btn-outline-secondary" type="submit">
              Sign in
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
